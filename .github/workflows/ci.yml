name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_JWT_SECRET: ci-test-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # services/auth/** and the billing checkout integration test are
      # knowingly excluded: they exercise in-progress demo scenarios and
      # fail by design.
      - name: Run tests
        run: >
          npx vitest run
          --exclude '**/node_modules/**'
          --exclude 'services/auth/**'
          --exclude '**/checkout-integration.test.ts'
