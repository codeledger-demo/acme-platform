name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_JWT_SECRET: ci-test-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Excluded suites either exercise in-progress demo scenarios
      # (services/auth, checkout-integration) or import package dist/
      # entries that require a full build of the demo monorepo.
      - name: Run tests
        run: >
          npx vitest run
          --exclude '**/node_modules/**'
          --exclude 'services/auth/**'
          --exclude '**/checkout-integration.test.ts'
          --exclude 'packages/api-client/tests/**'
          --exclude 'services/billing/tests/**'
          --exclude 'services/notifications/tests/**'
          --exclude 'services/reporting/tests/**'
          --exclude 'services/webhooks/tests/**'
