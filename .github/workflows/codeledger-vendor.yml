name: Vendor CodeLedger CLI

# Vendors a specific CodeLedger CLI release into .codeledger/bin/.
# Commits directly to main (org settings prevent Actions from opening PRs).

on:
  repository_dispatch:
    types: [codeledger-release]
  workflow_dispatch:
    inputs:
      version:
        description: "CodeLedger version to vendor (e.g. 0.10.32)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  vendor:
    name: Vendor CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ""   # no pnpm install in this job — skip cache setup

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version || github.event.client_payload.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::version input or client_payload.version is required"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Vendoring CodeLedger CLI v${VERSION}"

      - name: Install and vendor
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          npm install -g "@codeledger/cli@${VERSION}"
          codeledger --version
          codeledger init --force
          echo "Vendored v${VERSION} into .codeledger/bin/"

      - name: Commit directly to main
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Force-add because .codeledger/bin is in .gitignore
          git add -f .codeledger/bin/ || true
          git diff --cached --quiet \
            && echo "No changes -- .codeledger/bin already at v${VERSION}" \
            && exit 0
          git commit -m "chore: vendor codeledger CLI v${VERSION}"
          git push origin main
          echo "Pushed vendor update for v${VERSION} directly to main"

