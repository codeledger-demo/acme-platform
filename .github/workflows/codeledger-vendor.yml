name: Vendor CodeLedger CLI

# Vendors a specific CodeLedger CLI release into .codeledger/bin/.

on:
  repository_dispatch:
    types: [codeledger-release]
  workflow_dispatch:
    inputs:
      version:
        description: "CodeLedger version to vendor (e.g. 0.10.32)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor:
    name: Vendor CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version || github.event.client_payload.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::version input or client_payload.version is required"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Vendoring CodeLedger CLI v${VERSION}"

      - name: Install and vendor
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          npm install -g "@codeledger/cli@${VERSION}"
          codeledger --version
          codeledger init --force
          echo "Vendored v${VERSION} into .codeledger/bin/"

      - name: Open auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BRANCH="chore/codeledger-cli-v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq ".[0].number" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH} -- done"
            exit 0
          fi
          git checkout -b "$BRANCH"
          # Force-add because .codeledger/bin is in .gitignore
          git add -f .codeledger/bin/ || true
          git diff --cached --quiet && echo "No changes -- already up to date" && exit 0
          git commit -m "chore: vendor codeledger CLI v${VERSION}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: vendor codeledger CLI v${VERSION}" \
            --base main \
            --head "$BRANCH" \
            --body "Automatic CLI vendor update for CodeLedger v${VERSION}. Updates .codeledger/bin/ so post-merge workflows have access to the latest CLI commands.")
          echo "Created: $PR_URL"
          gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge not available -- please merge manually"
