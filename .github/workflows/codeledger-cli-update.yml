name: Update CodeLedger CLI

# Fires when codeledger-blackbox releases a new version.
#
# Two triggers:
#   repository_dispatch  — automatic, from release-dispatch.yml in codeledger-blackbox
#   workflow_dispatch    — manual trigger for catch-up / debugging (supply version)
#
# What it does:
#   1. Installs the newly released @codeledger/cli from npm
#   2. Runs `codeledger init --force` to re-vendor the standalone binary
#   3. Opens an auto-merge PR with the updated .codeledger/bin/ files
#
# The resulting PR keeps .codeledger/bin/codeledger-standalone.cjs in sync
# with every release so the codeledger-post-merge.yml workflow always has
# access to the latest commands shipped in that version.

on:
  repository_dispatch:
    types: [codeledger-release]
  workflow_dispatch:
    inputs:
      version:
        description: "CodeLedger version to vendor (e.g. 0.10.32)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cli:
    name: Vendor codeledger v${{ inputs.version || github.event.client_payload.version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Resolve version
        id: ver
        run: |
          # Prefer workflow_dispatch input; fall back to repository_dispatch payload
          VERSION="${{ inputs.version || github.event.client_payload.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version supplied via input or client_payload"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Vendoring CodeLedger CLI v${VERSION}"

      - name: Install released CLI version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          echo "Installing @codeledger/cli@${VERSION}"
          npm install -g "@codeledger/cli@${VERSION}"
          codeledger --version

      - name: Vendor standalone into repo
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          codeledger init --force
          rm -f AGENTS.md
          echo "Vendored codeledger v${VERSION} into .codeledger/bin/"

      - name: Open auto-merge PR with updated vendored CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BRANCH="chore/codeledger-cli-v${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Close any existing PR for this version to avoid duplicates
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq ".[0].number" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH} — skipping"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add -f .codeledger/bin/ .gitignore
          git diff --cached --quiet && echo "No CLI changes (already up-to-date)" && exit 0

          git commit -m "chore: vendor codeledger CLI v${VERSION}"
          git push origin "$BRANCH"

          PR_BODY=$(printf '## Summary\n\nAutomatic CLI vendor update for CodeLedger **v%s**.\n\nUpdates `.codeledger/bin/codeledger-standalone.cjs` so `codeledger-post-merge.yml`\nhas access to all commands shipped in this release.\n\n**Trigger:** `%s` from codeledgerECF/codeledger-blackbox\n\n:robot: Auto-generated - will auto-merge when CI passes.\n' "$VERSION" "${{ github.event_name }}")

          PR_URL=$(gh pr create \
            --title "chore: vendor codeledger CLI v${VERSION}" \
            --base main \
            --head "$BRANCH" \
            --body "$PR_BODY")
          echo "Created PR: $PR_URL"

          # Enable auto-merge so it lands without manual intervention
          gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge not available — merge manually"
